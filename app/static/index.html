<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlacidWay Assistant</title>
<style>
  :root{--bg:#f6f8fb;--card:#fff;--ink:#16202e;--muted:#5d6b7e;--brand:#0f7b8a;--brand-ink:#fff;--line:#e2e8f0;--user:#0f7b8a;--note:#fff7e0}
  @media(prefers-color-scheme:dark){:root{--bg:#0e141b;--card:#161e28;--ink:#e8eef6;--muted:#98a6b8;--line:#263241;--note:#2b2613}}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);height:100dvh;display:flex;flex-direction:column}
  header{padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:18px} header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
  #log{flex:1;overflow-y:auto;padding:20px;max-width:820px;width:100%;margin:0 auto}
  .msg{margin:0 0 14px;display:flex}.msg.user{justify-content:flex-end}
  .bubble{max-width:85%;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);overflow-wrap:anywhere}
  .user .bubble{background:var(--user);color:var(--brand-ink);border-color:var(--user)}
  .bubble ul{margin:6px 0 0;padding-left:20px}
  .src{margin-top:8px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px}
  .src a{color:var(--brand);border:1px solid var(--line);border-radius:999px;padding:2px 10px;text-decoration:none}
  .note{margin-top:8px;font-size:12.5px;background:var(--note);border-radius:8px;padding:6px 10px;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
  .chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
  form.lead{margin-top:10px;display:grid;gap:6px}
  form.lead input{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
  button.primary{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  #bar{border-top:1px solid var(--line);background:var(--card);padding:12px}
  #composer{max-width:820px;margin:0 auto;display:flex;gap:8px}
  #q{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
  .typing{color:var(--muted);font-style:italic}
</style>
</head>
<body>
<header><h1>PlacidWay Assistant</h1><p>Answers come only from PlacidWay pages, always with the source link.</p></header>
<main id="log" aria-live="polite"></main>
<div id="bar"><form id="composer" autocomplete="off">
  <input id="q" maxlength="1000" placeholder="Ask about treatments, prices or clinics…" aria-label="Your question" required>
  <button class="primary" id="send">Send</button>
</form></div>
<script>
const log = document.getElementById("log"), q = document.getElementById("q"), send = document.getElementById("send");
let history = [], disclaimerShown = false, busy = false;

function el(tag, cls, text){const e=document.createElement(tag); if(cls)e.className=cls; if(text!==undefined)e.textContent=text; return e;}
function renderText(box, text){
  let ul=null;
  text.split("\n").forEach(line=>{
    const m=line.match(/^\s*[-•*]\s+(.*)/);
    if(m){ if(!ul){ul=el("ul");box.appendChild(ul);} ul.appendChild(el("li",null,m[1])); }
    else{ ul=null; if(line.trim()) box.appendChild(el("div",null,line)); }
  });
}
function add(role, text){
  const row=el("div","msg "+role), b=el("div","bubble");
  if(role==="user") b.textContent=text; else renderText(b,text);
  row.appendChild(b); log.appendChild(row); log.scrollTop=log.scrollHeight; return b;
}
function leadForm(bubble){
  const f=el("form","lead"); f.append(el("div","note","Want a free quote? Leave your details and the PlacidWay team can follow up."));
  const n=el("input"),e=el("input"),m=el("input"),s=el("button","primary","Request a quote");
  n.placeholder="Your name";e.placeholder="Email";e.type="email";m.placeholder="What treatment? (optional)";[n,e].forEach(i=>i.required=true);
  f.append(n,e,m,s);
  f.onsubmit=async ev=>{ev.preventDefault();s.disabled=true;
    try{const r=await fetch("/api/lead",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n.value,email:e.value,message:m.value})});
      if(!r.ok) throw 0; f.replaceChildren(el("div","note","Thanks! Your details were saved and the team will be in touch."));
    }catch{s.disabled=false;f.append(el("div","note","Sorry, that didn't work. Please check your email address and try again."));}};
  bubble.appendChild(f);
}
async function ask(text){
  if(busy||!text.trim())return; busy=true; send.disabled=true;
  document.querySelector(".chips")?.remove();
  add("user",text); const wait=add("assistant",""); wait.classList.add("typing"); wait.textContent="Searching PlacidWay pages…";
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text,history:history.slice(-12),disclaimer_shown:disclaimerShown})});
    const d=await r.json(); wait.classList.remove("typing"); wait.replaceChildren();
    if(!r.ok){renderText(wait,d.detail||"Something went wrong. Please try again.");}
    else{
      renderText(wait,d.answer); history.push({role:"user",content:text},{role:"assistant",content:d.answer});
      if(d.sources.length){const s=el("div","src"); d.sources.forEach(x=>{const a=el("a",null,x.title);a.href=x.url;a.target="_blank";a.rel="noopener";s.appendChild(a);}); wait.appendChild(s);}
      if(d.disclaimer){wait.appendChild(el("div","note",d.disclaimer)); disclaimerShown=true;}
      if(d.offer_lead) leadForm(wait);
    }
  }catch{wait.classList.remove("typing"); wait.textContent="Network error. Please try again.";}
  busy=false; send.disabled=false; q.focus(); log.scrollTop=log.scrollHeight;
}
document.getElementById("composer").onsubmit=e=>{e.preventDefault();const t=q.value;q.value="";ask(t);};

add("assistant","Hi! Ask me about ITC Immunity Therapy Center's treatments, prices or packages. I only answer from PlacidWay pages and will tell you when I don't know.");
const chips=el("div","chips");
["What does the adrenal cancer package include?","Show me the ITC price list","¿Qué incluye el paquete de cáncer anal?"].forEach(t=>{const b=el("button",null,t);b.onclick=()=>ask(t);chips.appendChild(b);});
log.appendChild(chips);
</script>
</body>
</html>
